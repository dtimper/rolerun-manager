# La web se mudó a https://rolerun.github.io/ (repositorio
# rolerun/rolerun.github.io) el 25-09-2026. Aquí solo se publica una página
# que redirige allí, para que no se rompa ningún enlace antiguo a
# https://dtimper.github.io/rolerun-manager/ (incluidas las notas de v0.5.0).

name: Redirección de la web antigua

on:
  push:
    branches: [main]
    paths: [".github/redireccion-web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .github/redireccion-web
      - id: despliegue
        uses: actions/deploy-pages@v4
